plugins {
    // AGP 9.1.0：新版 androidx 要求；AGP 9.0+ 内置 Kotlin 支持
    id 'com.android.application' version '9.1.0'
    // Kotlin 子插件（compose/serialization），版本需与 AGP 内置 Kotlin 一致
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20'
    id 'com.google.devtools.ksp' version '2.3.12'
}

android {
    namespace 'com.cjhsy.linkzone'
    // compileSdk 37：新版 androidx（Compose 1.9/lifecycle 2.11/core-ktx 1.19 等）要求；targetSdk 保持 34 → 运行时行为不变
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.cjhsy.linkzone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        appSign {
            // 仓库内置固定 keystore：保证 CI / 设备 / 本地构建签名一致，可覆盖安装
            storeFile file('keystore/app.keystore')
            storePassword 'linkzone'
            keyAlias 'linkzone'
            keyPassword 'linkzone'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.appSign
            // 正式版出包通道：CI 固定跑 assembleDebug（workflow 文件受 token 权限限制
            // 暂无法改为 assembleRelease）。debuggable=false + 同 keystore + 不混淆，
            // 产物与 release 变体完全等效；release buildType 保留备用。
            debuggable false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.appSign
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    // 本地设备环境复用已安装的 build-tools 37.0.0 的 aapt2；
    // CI/其他环境该路径不存在时自动用 AGP 自带的 aapt2（从 Maven 下载）
    def localAapt2 = '/root/android-sdk/build-tools/37.0.0/aapt2'
    if (file(localAapt2).exists()) {
        aapt2FromMavenOverride = localAapt2
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'

    // QuickJS：eval_javascript 工具的 JS 引擎（ES2020，无 DOM/Node API）
    implementation 'io.github.dokar3:quickjs-kt:1.0.15'

    // Lifecycle / ViewModel / Activity
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    // ProcessLifecycleOwner：监听整个 App 前后台切换（回前台探活重连/增量同步）
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Compose BOM 2026.09.00 -> compose ui 1.9.x / material3 1.4.0
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // icons 已从 BOM 冻结在 1.7.x 线，必须显式版本（BOM 2026.09 不再管理）
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    // Network
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.0'
    // OkHttp SSE（LLM 流式响应）
    implementation 'com.squareup.okhttp3:okhttp-sse:5.5.0'

    // Room（本地对话持久化）
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // DI: Koin（4.2.2，compileSdk 36 已满足其 SDK 要求）
    implementation 'io.insert-koin:koin-android:4.2.2'
    implementation 'io.insert-koin:koin-androidx-compose:4.2.2'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Token 安全存储
    implementation 'androidx.security:security-crypto:1.1.0'

    // 图片加载（coil-compose；animation 动图段显示动图 + GIF 角标）
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // GIF / WebP 动图解码（coil 默认仅静态帧；image 段的 .gif 与 animation 段需要）
    implementation 'io.coil-kt:coil-gif:2.7.0'
    // SVG 解码（模型/厂商图标 assets/icons/*.svg，素材来自 RikkaHub）
    implementation 'io.coil-kt:coil-svg:2.7.0'

    // 视频内联播放（Media3 ExoPlayer，类 QQ 气泡内播放 + 全屏）
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    // WebView 小岛（Mermaid 图，离线 assets + WebViewAssetLoader）
    implementation 'androidx.webkit:webkit:1.17.1'

    // Markdown 渲染底座（RikkaHub 方案：AST 后台解析 + 分块渲染，长文滚动不卡）
    // RikkaHub fork 的 intellij-markdown（含 GFM 数学扩展 INLINE_MATH/BLOCK_MATH）
    implementation 'com.github.rikkahub:markdown:d79a97cc8e'
    // 代码语法高亮（MdCodeCard；原由 mikepenz markdown-renderer-code 传递引入）
    implementation 'dev.snipme:highlights:0.9.2'
    // HTML 片段解析（含 HTML 的 markdown 走 Jsoup DOM 渲染）
    implementation 'org.jsoup:jsoup:1.18.3'
    // LaTeX 原生渲染（jlatexmath-android，无 WebView）
    implementation 'com.github.rikkahub.jlatexmath-android:jlatexmath:1.5'
    implementation 'com.github.rikkahub.jlatexmath-android:jlatexmath-font-greek:1.5'
    implementation 'com.github.rikkahub.jlatexmath-android:jlatexmath-font-cyrillic:1.5'

    // PDF 文档文本提取（本地 AI 附件解析；DOCX/PPTX/XLSX/EPUB 走内置 Zip+XmlPullParser 零依赖）
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
