<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<style>
  /* 页面透明底：公式位图不带任何底板，字形直接浮在气泡背景上（豆包风格） */
  html, body { margin: 0; padding: 0; background: transparent; }
  /* shrink-to-fit：块级公式容器宽 = 公式本体宽，位图即公式本体，不被拉伸为整块白板 */
  #c {
    display: inline-block;
    box-sizing: border-box;
    text-align: center;
    font-size: 19px;
    color: #1F2328;
  }
  /* 去掉 KaTeX display 模式上下 margin：位图高度 = 公式本体高度，无多余留白 */
  #c .katex-display { margin: 0; }
  /* 行内公式离屏渲染容器：脱离文档流（不影响 #c 高度上报）、零 padding、白底深字、不换行 */
  #i {
    position: absolute;
    left: 0;
    top: 0;
    display: inline-block;
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #1F2328;
    white-space: nowrap;
    font-size: 16px;
  }
</style>
<script src="katex.min.js"></script>
</head>
<body>
<div id="c"></div>
<div id="i"></div>
<script>
  // 块级公式离屏渲染（原生 MdOffscreen 调用，第二参为字形颜色）：
  // 只上报公式本体尺寸（#c 已 shrink-to-fit 且 display margin 为 0），
  // 原生按此尺寸截取透明底位图并在气泡内居中 —— 公式浮在背景上，无任何底板
  window.renderBlock = function (tex, color) {
    try {
      var c = document.getElementById('c');
      c.style.color = color || '#1F2328';
      katex.render(tex, c, {
        displayMode: true,
        throwOnError: true,
        output: 'html'
      });
      var dpr = window.devicePixelRatio || 1;
      var r = c.getBoundingClientRect();
      if (window.LinkZone) {
        LinkZone.onSize(JSON.stringify({
          w: Math.ceil(Math.max(r.width, c.scrollWidth) * dpr),
          h: Math.ceil(r.height * dpr)
        }));
      }
    } catch (e) {
      if (window.LinkZone) LinkZone.onError(String((e && e.message) || e));
    }
  };

  // 行内公式离屏渲染：渲染进脱离文档流的 #i，精确上报几何（css px，原生侧按 density 换算）
  // depth = 内容底边相对文字基线的下沉量（可为负/0），供原生侧位图底部留白做基线对齐
  window.renderInline = function (tex) {
    try {
      var el = document.getElementById('i');
      el.innerHTML = '';
      var holder = document.createElement('span');
      // 同线零尺寸参照元素：其 bottom 即公式行基线位置
      var ref = document.createElement('span');
      ref.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
      el.appendChild(holder);
      el.appendChild(ref);
      katex.render(tex, holder, {
        displayMode: false,
        throwOnError: true,
        output: 'html'
      });
      var contentRect = el.getBoundingClientRect();
      var refRect = ref.getBoundingClientRect();
      LinkZone.onInline(JSON.stringify({
        w: Math.ceil(contentRect.width),
        h: Math.ceil(contentRect.height),
        depth: contentRect.bottom - refRect.bottom
      }));
    } catch (e) {
      if (window.LinkZone) LinkZone.onInlineError(String((e && e.message) || e));
    }
  };
</script>
</body>
</html>
