<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #c {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 8px;
    overflow-x: auto;
    text-align: center;
    font-size: 19px;
    color: #1F2328;
  }
  /* 行内公式离屏渲染容器：脱离文档流（不影响 #c 高度上报）、零 padding、白底深字、不换行 */
  #i {
    position: absolute;
    left: 0;
    top: 0;
    display: inline-block;
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #1F2328;
    white-space: nowrap;
    font-size: 16px;
  }
</style>
<script src="katex.min.js"></script>
</head>
<body>
<div id="c"></div>
<div id="i"></div>
<script>
  function reportHeight() {
    var h = document.getElementById('c').getBoundingClientRect().height;
    if (h > 0 && window.LinkZone) {
      // 上报物理像素：css px * devicePixelRatio，原生侧按 density 转回 dp
      LinkZone.onHeight(Math.ceil(h * (window.devicePixelRatio || 1)));
    }
  }

  window.renderFormula = function (tex) {
    try {
      katex.render(tex, document.getElementById('c'), {
        displayMode: true,
        throwOnError: true,
        output: 'html'
      });
      reportHeight();
      setTimeout(reportHeight, 50);
    } catch (e) {
      if (window.LinkZone) LinkZone.onError(String((e && e.message) || e));
    }
  };

  // 行内公式离屏渲染：渲染进脱离文档流的 #i，精确上报几何（css px，原生侧按 density 换算）
  // depth = 内容底边相对文字基线的下沉量（可为负/0），供原生侧位图底部留白做基线对齐
  window.renderInline = function (tex) {
    try {
      var el = document.getElementById('i');
      el.innerHTML = '';
      var holder = document.createElement('span');
      // 同线零尺寸参照元素：其 bottom 即公式行基线位置
      var ref = document.createElement('span');
      ref.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
      el.appendChild(holder);
      el.appendChild(ref);
      katex.render(tex, holder, {
        displayMode: false,
        throwOnError: true,
        output: 'html'
      });
      var contentRect = el.getBoundingClientRect();
      var refRect = ref.getBoundingClientRect();
      LinkZone.onInline(JSON.stringify({
        w: Math.ceil(contentRect.width),
        h: Math.ceil(contentRect.height),
        depth: contentRect.bottom - refRect.bottom
      }));
    } catch (e) {
      if (window.LinkZone) LinkZone.onInlineError(String((e && e.message) || e));
    }
  };

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.getElementById('c'));
  }
</script>
</body>
</html>
