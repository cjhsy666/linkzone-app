<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #c { width: 100%; overflow: hidden; }
  #c svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="c"></div>
<script>
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'strict' });

  // 上报 SVG 实际包围盒高度（相对容器顶部），而不是容器高度：
  // 容器高度可能混入残留布局/留白，导致位图底部出现大片白边。
  function reportGeometry() {
    if (!window.LinkZone) return;
    var c = document.getElementById('c');
    var svg = c.querySelector('svg');
    if (!svg) return;
    var cr = c.getBoundingClientRect();
    var sr = svg.getBoundingClientRect();
    var h = Math.ceil((sr.bottom - cr.top) * (window.devicePixelRatio || 1));
    if (h > 0) LinkZone.onHeight(h);
  }

  function cleanupStale() {
    // mermaid.render 失败时可能残留同 id 临时节点，导致下次渲染报 duplicate id
    var stale = document.getElementById('g');
    if (stale) stale.parentNode.removeChild(stale);
    var dm = document.querySelectorAll('div[id^="dmermaid"], [id^="mermaid-"]');
    for (var i = 0; i < dm.length; i++) {
      if (dm[i].id !== 'c' && dm[i].parentNode) dm[i].parentNode.removeChild(dm[i]);
    }
  }

  var rendering = false;
  var pending = null;   // 渲染中收到的新代码：渲染完成后补渲染，避免流式末尾内容被丢弃

  window.renderDiagram = async function (code) {
    if (rendering) { pending = code; return; }
    rendering = true;
    try {
      cleanupStale();
      var result = await mermaid.render('g', code);
      document.getElementById('c').innerHTML = result.svg;
      reportGeometry();
      // 字体/布局稳定后再报两次，避免首次高度偏小；fonts.ready 加 300ms 竞速兜底
      setTimeout(reportGeometry, 50);
      if (document.fonts && document.fonts.ready) {
        Promise.race([
          document.fonts.ready,
          new Promise(function (resolve) { setTimeout(resolve, 300); })
        ]).then(reportGeometry);
      }
    } catch (e) {
      cleanupStale();
      if (window.LinkZone) LinkZone.onError(String((e && e.message) || e));
    } finally {
      rendering = false;
      if (pending !== null) {
        var next = pending;
        pending = null;
        window.renderDiagram(next);
      }
    }
  };

  if (window.ResizeObserver) {
    new ResizeObserver(reportGeometry).observe(document.getElementById('c'));
  }
</script>
</body>
</html>
